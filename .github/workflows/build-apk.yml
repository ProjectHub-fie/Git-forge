
name: Build GitForge APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build Debug and Release APKs
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Stage updater-compatible APK names
        # The in-app updater selects app-debug.apk / app-release.apk (see
        # UpdateModels.assetFor). Keep those exact names so the staged files
        # match the channel contract instead of failing late after download.
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk app-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitForge-APKs
          path: |
            app-debug.apk
            app-release.apk

      # The release APK here is unsigned (no keystore in CI): it proves the
      # build compiles but cannot update an installed app. Attach the debug APK
      # for testers; do NOT attach the unsigned release APK to a release.
      - name: Attach debug APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            app-debug.apk \
            --clobber

