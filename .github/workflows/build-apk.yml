
name: Build GitForge APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug and Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build Debug and Release APKs
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Stage APK files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk app-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitForge-APKs
          path: |
            app-debug.apk
            app-release.apk
          if-no-files-found: error
          retention-days: 14

  email-notification:
    name: Email Build Result
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Send build result email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "GitForge APK Build: ${{ needs.build.result }}"
          to: ${{ secrets.MAIL_TO }}
          from: "GitForge Build Bot <${{ secrets.MAIL_USERNAME }}>"
          body: |
            GitForge APK build has finished.

            Result: ${{ needs.build.result }}
            Repository: ${{ github.repository }}
            Branch or ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Workflow run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ${{ needs.build.result == 'success' && 'The APK build completed. Download the GitForge-APKs artifact from this workflow run.' || 'The build failed or was cancelled. Open the workflow run link above to inspect the logs.' }}
